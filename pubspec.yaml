name: frostrealm
description: "Frost Legend - social casino slots."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  rinf: 8.10.1
  meta: ^1.16.0
  tuple: ^2.0.2
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - Frost_Legend_assets/Frost_Legend_gameplay_assets/
    - Frost_Legend_assets/Frost_Legend_additional_assets/

  fonts:
    - family: Lilita
      fonts:
        - asset: fonts/LilitaOne-Regular.ttf
